<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Backyard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c8d8; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  canvas { display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  body.plan #fx, body.plan #speed, body.plan #hint { display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 6vmin system-ui; color: #1d3557; background: #b9c8d8; z-index: 20; }
  #edit { position: fixed; left: calc(env(safe-area-inset-left) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 7; padding: 8px 12px; border: 0; border-radius: 10px;
    background: rgba(29,53,87,0.85); color: #fff; font: 700 14px system-ui; cursor: pointer; }
  #speed { position: fixed; right: calc(env(safe-area-inset-right) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 5; color: #fff; font: 800 15px system-ui; text-shadow: 0 1px 3px #000a; pointer-events: none; }
  #who { position: fixed; top: calc(env(safe-area-inset-top) + 2vmin); left: 50%; transform: translateX(-50%); z-index: 7; display: flex; gap: 6px; }
  #who button { font: 22px system-ui; width: 46px; height: 42px; border: 0; border-radius: 10px; background: rgba(29,53,87,0.6); cursor: pointer; padding: 0; }
  #who button.on { background: #f5c242; }
  body.plan #who, body.onfoot #speed, body.onfoot #tc-thr { display: none !important; }
  #banner { position: fixed; left: 0; right: 0; top: 28%; width: fit-content; max-width: 84vw; margin: 0 auto; padding: 1vmin 6vmin; text-align: center; pointer-events: none; z-index: 10; opacity: 0;
    font: 800 max(15px, 3.2vmin)/1.25 "Avenir Next", Avenir, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #f5c242;
    background: radial-gradient(closest-side, rgba(8,10,18,0.55), rgba(8,10,18,0)); text-shadow: 0 0 2px #000, 0 1px 3px #000c; }
  #banner.show { animation: banner 2s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(1.2); } 8% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #hint { position: fixed; left: 50%; bottom: 4vmin; transform: translateX(-50%); z-index: 5; padding: 8px 14px; border-radius: 10px; background: rgba(12,22,38,0.75); color: #fff;
    font: 600 14px system-ui; opacity: 0; transition: opacity 0.5s; pointer-events: none; white-space: nowrap; }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
<div id="loading">🏡 The Backyard…</div>
<canvas id="fx"></canvas>
<button id="edit">🗺️ Edit</button>
<div id="speed"></div>
<div id="who"></div>
<div id="banner"></div>
<div id="hint">Arrows fly (↓ nose up) or run · Shift / Z throttle · Space barks · S: next one (🖤 🐕 🐶 🐈) · T or 🗺️ edits · Esc quits</div>
<script src="backyard.js?v=f5d52d2"></script>
</body>
</html>
