<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Backyard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c8d8; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  canvas { display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  body.plan #fx, body.plan #speed, body.plan #hint { display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 6vmin system-ui; color: #1d3557; background: #b9c8d8; z-index: 20; }
  #edit { position: fixed; left: calc(env(safe-area-inset-left) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 7; padding: 8px 12px; border: 0; border-radius: 10px;
    background: rgba(29,53,87,0.85); color: #fff; font: 700 14px system-ui; cursor: pointer; }
  #size-btn { position: fixed; left: calc(env(safe-area-inset-left) + 2vmin + 92px); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 7; padding: 8px 10px; border: 0; border-radius: 10px;
    background: rgba(29,53,87,0.85); color: #fff; font: 700 14px system-ui; cursor: pointer; }
  #view-btn { display: none; position: fixed; left: calc(env(safe-area-inset-left) + 2vmin + 140px); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 7; padding: 8px 10px; border: 0; border-radius: 10px;
    background: #f5c242; color: #1d3557; font: 800 14px system-ui; cursor: pointer; box-shadow: 0 2px 8px #0005; }
  body.snow #view-btn { display: block; }
  #xhair { display: none; position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; border: 2px solid #fffd; box-shadow: 0 0 3px #000a; pointer-events: none; z-index: 5; }
  body.snow.fp #xhair { display: block; }
  #sizes { display: none; position: fixed; left: calc(env(safe-area-inset-left) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin + 50px); z-index: 12; width: min(300px, calc(100vw - 4vmin - 24px));
    padding: 12px; border-radius: 12px; background: rgba(12,22,38,0.92); color: #fff; font: 700 14px system-ui; box-shadow: 0 4px 18px #0006; }
  #sizes.open { display: block; }
  #sizes .title { color: #fff3b0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #sizes label { display: grid; grid-template-columns: 82px 1fr 46px; align-items: center; gap: 8px; margin: 6px 0; }
  #sizes input { width: 100%; accent-color: #f5c242; }
  #sizes b { text-align: right; color: #f5c242; }
  #sizes button { font: 700 14px system-ui; padding: 7px 10px; border: 0; border-radius: 8px; background: #2c4a73; color: #fff; cursor: pointer; }
  #sizes .sub { color: #9aa4b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }
  #sizes .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #sizes .hint { margin-top: 8px; color: #9aa4b8; font-weight: 500; font-size: 12px; }
  #speed { position: fixed; right: calc(env(safe-area-inset-right) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 5; color: #fff; font: 800 15px system-ui; text-shadow: 0 1px 3px #000a; pointer-events: none; }
  #who { position: fixed; top: calc(env(safe-area-inset-top) + 2vmin); left: 50%; transform: translateX(-50%); z-index: 7; display: flex; gap: 6px; }
  #who button { font: 22px system-ui; width: 46px; height: 42px; border: 0; border-radius: 10px; background: rgba(29,53,87,0.6); cursor: pointer; padding: 0; }
  #who button.on { background: #f5c242; }
  #who button[data-who=plane] { width: 58px; }
  @media (max-width: 560px) { #who { top: calc(env(safe-area-inset-top) + 2vmin + 46px); } #who button { width: 42px; height: 38px; font-size: 20px; } } /* (a phone: under the Edit button) */
  #family { display: none; position: fixed; top: calc(env(safe-area-inset-top) + 2vmin + 50px); left: 50%; transform: translateX(-50%); z-index: 12; width: min(420px, calc(100vw - 24px));
    grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(12,22,38,0.92); box-shadow: 0 4px 18px #0006; }
  #family.open { display: grid; }
  #family .title { grid-column: 1 / -1; color: #fff3b0; font: 700 14px system-ui; padding: 2px 4px 4px; }
  #family button[data-mode] { justify-content: center; font-size: 15px; padding: 8px; }
  #family button { display: flex; align-items: center; gap: 8px; padding: 10px; border: 0; border-radius: 8px; background: #2c4a73; color: #fff; font: 700 16px system-ui; cursor: pointer; text-align: left; }
  #family button span { font-size: 26px; }
  #family button.on { background: #f5c242; color: #1d3557; }
  @media (max-width: 560px) { #family { top: calc(env(safe-area-inset-top) + 2vmin + 92px); } }
  /* ❄️ the snowball fight's scores (top right) and your snowballs */
  #snowhud { display: none; position: fixed; right: calc(env(safe-area-inset-right) + 2vmin); top: calc(env(safe-area-inset-top) + 2vmin); z-index: 6; padding: 6px 10px; border-radius: 12px;
    background: rgba(12,22,38,0.6); color: #fff; font: 800 18px system-ui; pointer-events: none; }
  #snowhud.show { display: block; }
  #snowhud .team { display: grid; grid-template-columns: auto 70px 40px; align-items: center; gap: 6px; padding: 2px 6px; border-left: 4px solid var(--c); margin: 2px 0; }
  #snowhud .team em { height: 10px; border-radius: 5px; background: #fff3; overflow: hidden; }
  #snowhud .team em i { display: block; height: 100%; background: var(--c); border-radius: 5px; transition: width 0.3s; }
  #snowhud .team b { text-align: right; font-size: 14px; }
  #snowhud .team.me { background: #fff2; }
  #snowhud .free { padding: 2px 6px; font-size: 15px; }
  #charge { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12vmin); transform: translateX(-50%); width: min(260px, 50vw); height: 16px; border-radius: 8px;
    background: rgba(12,22,38,0.6); border: 2px solid #fff; overflow: hidden; z-index: 6; pointer-events: none; }
  #charge.show { display: block; }
  #charge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8fd3ff, #f5c242, #e0483c); }
  #snowhud div { display: flex; justify-content: space-between; gap: 10px; padding: 1px 4px; border-radius: 6px; }
  #snowhud div.me { background: #f5c242; color: #1d3557; }
  #snowhud .ammo { display: block; margin-top: 4px; text-align: center; font-size: 15px; background: none !important; color: #fff !important; }
  #snowhud i { font-weight: 600; font-size: 12px; font-style: normal; }
  @media (max-width: 560px) { #snowhud { top: calc(env(safe-area-inset-top) + 2vmin + 92px); font-size: 15px; } }
  #planes { display: none; position: fixed; top: calc(env(safe-area-inset-top) + 2vmin + 50px); left: 50%; transform: translateX(-50%); z-index: 12; width: min(420px, calc(100vw - 24px));
    grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(12,22,38,0.92); box-shadow: 0 4px 18px #0006; }
  #planes.open { display: grid; }
  #planes button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: #2c4a73; color: #fff; font: 700 14px system-ui; cursor: pointer; text-align: left; }
  #planes button span { font-size: 20px; }
  #planes button.on { background: #f5c242; color: #1d3557; }
  @media (max-width: 560px) { #planes { top: calc(env(safe-area-inset-top) + 2vmin + 92px); } }
  body.plan #planes, body.plan #family, body.plan #snowhud, body.plan #view-btn, body.plan #xhair,
  body.plan #who, body.plan #oob, body.plan #size-btn, body.plan #sizes, body.onfoot #speed, body.onfoot #tc-thr { display: none !important; }
  /* 🚫 out over the fence: OUT OF BOUNDS, in red, pulsing, till the plane's back in */
  #oob { position: fixed; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; z-index: 9; opacity: 0; transition: opacity 0.15s;
    font: italic 900 max(26px, 7vmin)/1 "Avenir Next", Avenir, Impact, system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    color: #ff2b2b; -webkit-text-stroke: 1.5px #5a0000; text-shadow: 0 0 6px #ff0000, 0 0 18px #ff3b3b, 0 0 36px #b30000, 0 3px 0 #4a0000; }
  #oob.show { opacity: 1; animation: oob 0.6s ease-in-out infinite alternate; }
  @keyframes oob { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.07); filter: brightness(1.35); } }
  #banner { position: fixed; left: 0; right: 0; top: 28%; width: fit-content; max-width: 84vw; margin: 0 auto; padding: 1vmin 6vmin; text-align: center; pointer-events: none; z-index: 10; opacity: 0;
    font: 800 max(15px, 3.2vmin)/1.25 "Avenir Next", Avenir, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #f5c242;
    background: radial-gradient(closest-side, rgba(8,10,18,0.55), rgba(8,10,18,0)); text-shadow: 0 0 2px #000, 0 1px 3px #000c; }
  #banner.show { animation: banner 2s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(1.2); } 8% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #hint { position: fixed; left: 50%; bottom: 4vmin; transform: translateX(-50%); z-index: 5; padding: 8px 14px; border-radius: 10px; background: rgba(12,22,38,0.75); color: #fff;
    font: 600 14px system-ui; opacity: 0; transition: opacity 0.5s; pointer-events: none; white-space: nowrap; }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
<div id="loading">🏡 The Backyard…</div>
<canvas id="fx"></canvas>
<button id="edit">🗺️ Edit</button>
<button id="size-btn" title="Settings">⚙️</button>
<button id="view-btn" title="View (V)">🎥 3rd</button>
<div id="xhair"></div>
<div id="sizes"></div>
<div id="speed"></div>
<div id="who"></div>
<div id="planes"></div>
<div id="family"></div>
<div id="snowhud"></div>
<div id="charge"><i></i></div>
<div id="banner"></div>
<div id="oob">Out of Bounds</div>
<div id="hint">Arrows fly (↓ nose up) or run · Shift / Z throttle · Space barks / throws (hold: harder) · V: 1st / 3rd person · S: next one (✈️ planes, 🐕 🐶 🐈, ❄️ the family) · T or 🗺️ edits · Esc quits</div>
<script src="backyard.js?v=b38fff1"></script>
</body>
</html>
