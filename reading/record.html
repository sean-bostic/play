<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Record your voice</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 20%, #fff8e7 0%, #ffe3b3 70%, #ffc98a 100%); color: #3b2a60;
    font: 18px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 28px; min-height: 100vh; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font: 900 30px "Comic Sans MS", "Chalkboard SE", sans-serif; color: #7b3fe4; }
  h2 { margin: 0; font-size: 19px; color: #7b3fe4; }
  p { margin: 0; }
  .note { color: #6d5a8c; font-size: 15px; }
  .panel { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 3px 0 #e0c9a0; }
  .passage { font: 22px/1.55 "Andika", "Comic Sans MS", "Chalkboard SE", sans-serif; }
  .passage p + p { margin-top: 10px; }
  .card { text-align: center; padding: 26px 16px; }
  .say { font: 900 84px/1.1 "Andika", "Comic Sans MS", "Chalkboard SE", sans-serif; color: #e5186d; }
  .hint { font-size: 21px; margin-top: 6px; }
  .count { color: #6d5a8c; font-size: 15px; text-align: center; }
  .bar { height: 10px; border-radius: 5px; background: #f1e3cc; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #06d6a0; width: 0; }
  button { font: 800 20px system-ui, sans-serif; border: 0; border-radius: 14px; padding: 16px; color: #fff; background: #7b3fe4; box-shadow: 0 3px 0 #5a2db0; width: 100%; min-height: 56px; cursor: pointer; }
  button.go { background: #06a77d; box-shadow: 0 3px 0 #04795b; font-size: 24px; min-height: 76px; }
  button.quiet { background: #fff; color: #7b3fe4; box-shadow: inset 0 0 0 2px #cdb8f2; font-size: 17px; min-height: 48px; padding: 10px; }
  .row { display: flex; gap: 10px; }
  .rec { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: #d11a4f; }
  .rec::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #d11a4f; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: 0.25; } }
  audio { width: 100%; }
  input[type=file] { font-size: 16px; }
  .bad { color: #b3173f; font-weight: 700; }
  .good { color: #04795b; font-weight: 700; }
</style>
</head>
<body>
<main id="app"></main>
<script src="record.js"></script>
</body>
</html>
