<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brawl</title>
<style>
  :root { --ink: #16181d; --red: #e0262e; --blue: #2b6cff; --gold: #ffe23a; --panel: rgba(16, 18, 24, 0.88);
    --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom); --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #fff; font: 800 15px/1.2 system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #over { pointer-events: none; z-index: 2; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0d12; z-index: 50; font-size: 26px; }

  /* the top: your health and theirs, and the rounds each has won */
  #hud { position: fixed; z-index: 3; left: calc(var(--sl) + 12px); right: calc(var(--sr) + 12px); top: calc(var(--st) + 10px); display: none; gap: 14px; align-items: flex-start; pointer-events: none; text-shadow: 0 2px 0 var(--ink); }
  body.playing #hud { display: flex; }
  .side { flex: 1; } .side.r { text-align: right; }
  .bar { height: 18px; border: 3px solid var(--ink); border-radius: 6px; background: #3a1216; overflow: hidden; display: flex; }
  .side.r .bar { justify-content: flex-end; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#7dff6a, #2fbf3f); transition: width 0.15s; }
  .bar i.low { background: linear-gradient(#ff9a5e, var(--red)); }
  .who { display: flex; justify-content: space-between; margin-top: 3px; font-size: 13px; } .side.r .who { flex-direction: row-reverse; }
  .who b { color: var(--gold); letter-spacing: 2px; }

  #banner { position: fixed; z-index: 4; left: 0; right: 0; top: 24%; text-align: center; font: 900 min(17vw, 96px) "Arial Black", Impact, system-ui; color: var(--gold); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink); pointer-events: none; opacity: 0; }
  #banner small { display: block; font-size: 0.3em; color: #fff; -webkit-text-stroke: 0; }
  #banner.show { animation: banner 1.3s ease-out both; }
  @keyframes banner { 0% { opacity: 0; transform: scale(2.2); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(0.9); } }

  /* the phone's controls: the left half is the stick, the buttons sit under the right thumb */
  #stick, #pad { display: none; }
  @media (pointer: coarse) { body.playing #stick, body.playing #pad { display: block; } #keys { display: none; } }
  #stick { position: fixed; z-index: 3; left: 0; top: 0; bottom: 0; width: 50%; touch-action: none; }
  #ring { display: none; position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 3px solid #ffffff66; background: #ffffff14; pointer-events: none; }
  #nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: #ffffffaa; transform: translate(-50%, -50%); }
  #pad { position: fixed; z-index: 3; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 18px); width: 230px; height: 190px; touch-action: none; }
  #pad button { position: absolute; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); font-size: 15px; text-shadow: 0 2px 0 #0006; touch-action: none; opacity: 0.9; }
  #pad button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); filter: brightness(1.3); }
  #pad [data-do=punch] { right: 0; bottom: 0; width: 104px; height: 104px; background: var(--red); font-size: 18px; }
  #pad [data-do=kick] { right: 98px; bottom: 74px; width: 84px; height: 84px; background: #f08a1c; }
  #pad [data-do=block] { right: 122px; bottom: 0; width: 72px; height: 72px; background: var(--blue); }

  .panel { position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: #0b0d12aa; text-align: center; padding: 16px; }
  .panel[hidden], body.playing #menu { display: none; }
  h1 { margin: 0; font: 900 min(24vw, 120px)/0.9 "Arial Black", Impact, system-ui; color: var(--gold); -webkit-text-stroke: 4px var(--ink); text-shadow: 0 8px 0 var(--red), 0 8px 0 var(--ink); transform: rotate(-4deg); }
  .panel p { margin: 0; color: #cfd6e2; font-weight: 600; max-width: 30em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .panel button { padding: 14px 22px; border-radius: 12px; background: var(--panel); border: 3px solid #ffffff44; font-size: 18px; }
  .panel button.last { border-color: var(--gold); }
  .panel button.go { background: var(--red); border-color: var(--ink); }
  #result { font: 900 min(16vw, 84px) "Arial Black", Impact, system-ui; -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink); }
  #result.won { color: var(--gold); } #result.lost { color: #c9ced6; }
</style>
<style id="touch-feel">
  html, body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
  canvas { touch-action: none; }
</style>
<script id="touch-feel-js">
  (() => {
    const typing = (e) => e.target.closest?.('input, textarea, [contenteditable]');
    for (const ev of ['contextmenu', 'selectstart', 'dragstart']) addEventListener(ev, (e) => { if (!typing(e)) e.preventDefault(); });
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="over"></canvas>
<div id="loading">Brawl…</div>

<div id="hud">
  <div class="side"><div class="bar"><i id="hp0"></i></div><div class="who"><span>You</span><b id="won0"></b></div></div>
  <div class="side r"><div class="bar"><i id="hp1"></i></div><div class="who"><span id="them">Bot</span><b id="won1"></b></div></div>
</div>
<div id="banner"></div>

<div id="stick"><div id="ring"><div id="nub"></div></div></div>
<div id="pad">
  <button data-do="kick">Kick</button>
  <button data-do="block">Block</button>
  <button data-do="punch">Punch</button>
</div>

<div id="menu" class="panel">
  <h1>BRAWL</h1>
  <p>Circle them. Make them miss. Hit back.</p>
  <div class="row">
    <button data-level="easy">Easy</button>
    <button data-level="medium">Medium</button>
    <button data-level="hard">Hard</button>
  </div>
  <p id="keys">Move: WASD or arrows · Punch: J · Kick: K · Block: L or Space</p>
</div>
<div id="end" class="panel" hidden>
  <div id="result"></div>
  <div class="row"><button id="again" class="go">Again</button><button id="back">Menu</button></div>
</div>
<script src="brawl.js?v=1de2352"></script>
</body>
</html>
