<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brawl: The Split Lip</title>
<style>
  :root { --ink: #0d0907; --bone: #e8dcc0; --blood: #8c1c13; --wood: #2a1c12; --dim: #a89878;
    --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom); --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--bone); font: 16px/1.25 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #over { pointer-events: none; z-index: 2; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ink); z-index: 50; font-size: 24px; font-style: italic; }
  #fade { position: fixed; inset: 0; z-index: 40; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.38s; } #fade.on { opacity: 1; }

  /* the top. Round the tavern: your purse and how much you've had. In a fight: your blood and his. */
  #purse, #hud { position: fixed; z-index: 3; left: calc(var(--sl) + 12px); right: calc(var(--sr) + 12px); top: calc(var(--st) + 10px); display: none; pointer-events: none; text-shadow: 0 1px 0 #000, 0 0 6px #000; }
  body.tavern #purse, body.fight #purse { display: flex; gap: 16px; } body.fight #purse { top: calc(var(--st) + 52px); font-size: 13px; color: var(--dim); }
  body.fight #hud { display: flex; gap: 14px; align-items: flex-start; }
  .side { flex: 1; } .side.r { text-align: right; }
  .bar { height: 10px; border: 2px solid var(--ink); background: #1b0d0a; display: flex; } .side.r .bar { justify-content: flex-end; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--blood); transition: width 0.15s; }
  .bar.wind { height: 4px; margin-top: 2px; border-width: 1px; } .bar.wind i { background: var(--dim); transition: none; } .bar.wind i.out { background: #c9a227; }
  .who { margin-top: 3px; font-size: 13px; font-style: italic; }

  /* what's said: a line over a man's head; the story at the bottom; a question in the middle */
  #says div { display: none; position: fixed; z-index: 3; transform: translate(-50%, -100%); max-width: min(62vw, 300px); padding: 4px 9px; background: #0d0907d9; border: 1px solid #5a4630; border-radius: 3px; font-size: 14px; font-style: italic; text-align: center; pointer-events: none; }
  #note { position: fixed; z-index: 4; left: 50%; bottom: calc(var(--sb) + 24%); transform: translateX(-50%); width: min(86vw, 520px); text-align: center; font-size: 17px; text-shadow: 0 1px 0 #000, 0 0 8px #000, 0 0 3px #000; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
  #note.show { opacity: 1; }
  #ask { position: fixed; z-index: 12; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(84vw, 380px); padding: 16px 18px; background: #140d09f2; border: 2px solid #5a4630; box-shadow: 0 0 0 2px var(--ink), 0 12px 40px #000; text-align: center; }
  #ask[hidden] { display: none; }
  #who { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); } #what { margin: 8px 0 14px; font-size: 19px; font-style: italic; }
  #ask .row { display: flex; gap: 10px; justify-content: center; } #ask button { flex: 1; padding: 12px 8px; background: var(--wood); border: 1px solid #5a4630; font-size: 16px; } #ask button[hidden] { display: none; }
  #yes { background: var(--blood) !important; }

  /* the phone's controls: the left half is the stick; drag anywhere else to look; in a fight the buttons sit under the right thumb */
  #stick, #pad, #look { display: none; position: fixed; touch-action: none; }
  #look { inset: 0; z-index: 2; } body.tavern #look { display: block; }
  @media (pointer: coarse) { body.tavern #stick, body.fight #stick, body.fight #pad { display: block; } .keys { display: none; } }
  #stick { z-index: 3; left: 0; top: 0; bottom: 0; width: 50%; }
  #ring { display: none; position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid #e8dcc055; background: #0d090755; pointer-events: none; }
  #nub { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%; background: #e8dcc088; transform: translate(-50%, -50%); }
  #pad { z-index: 3; right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 18px); width: 230px; height: 190px; }
  #pad button { position: absolute; border-radius: 50%; background: #1a110bcc; border: 2px solid #e8dcc077; font-size: 15px; font-style: italic; touch-action: none; }
  #pad button.on { background: #5a1410; border-color: var(--bone); }
  #pad [data-do=punch] { right: 0; bottom: 0; width: 104px; height: 104px; font-size: 18px; }
  #pad [data-do=kick] { right: 98px; bottom: 74px; width: 84px; height: 84px; }
  #pad [data-do=block] { right: 122px; bottom: 0; width: 72px; height: 72px; }
  #pad [data-do=dodge] { right: 6px; bottom: 114px; width: 72px; height: 72px; }

  #title { position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #0d0907b0; text-align: center; padding: 16px; box-sizing: border-box; }
  body.tavern #title, body.fight #title { display: none; }
  h1 { margin: 0; font: 400 min(11vw, 84px)/0.95 Georgia, serif; letter-spacing: 0.04em; color: var(--bone); text-shadow: 0 3px 0 #000, 0 0 30px #b3320e88; }
  #title p { margin: 0; color: var(--dim); font-style: italic; max-width: 30em; }
  #enter { margin-top: 8px; padding: 14px 26px; background: var(--blood); border: 1px solid var(--ink); font-size: 19px; }
</style>
<style id="touch-feel">
  html, body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
  canvas { touch-action: none; }
</style>
<script id="touch-feel-js">
  (() => {
    const typing = (e) => e.target.closest?.('input, textarea, [contenteditable]');
    for (const ev of ['contextmenu', 'selectstart', 'dragstart']) addEventListener(ev, (e) => { if (!typing(e)) e.preventDefault(); });
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="over"></canvas>
<div id="loading">The Split Lip…</div>

<div id="hud">
  <div class="side"><div class="bar"><i id="hp0"></i></div><div class="bar wind"><i id="wd0"></i></div><div class="who">You</div></div>
  <div class="side r"><div class="bar"><i id="hp1"></i></div><div class="bar wind"><i id="wd1"></i></div><div class="who" id="them"></div></div>
</div>
<div id="purse"><span id="coin"></span><span id="ale"></span></div>
<div id="says"><div></div><div></div><div></div></div>
<div id="note"></div>

<div id="look"></div>
<div id="stick"><div id="ring"><div id="nub"></div></div></div>
<div id="pad">
  <button data-do="kick">Kick</button>
  <button data-do="block">Block</button>
  <button data-do="dodge">Slip</button>
  <button data-do="punch">Punch</button>
</div>

<div id="ask" hidden>
  <div id="who"></div><div id="what"></div>
  <div class="row"><button id="yes"></button><button id="no"></button></div>
</div>

<div id="title">
  <h1>The Split Lip</h1>
  <p>A tavern. Ale, dice, and bare knuckles in the hay.</p>
  <button id="enter">Push the door open</button>
  <p class="keys">Walk: WASD · Look: ← → or drag · In a fight: J punch (hold for a haymaker), K kick, L block, Space slip · Answer: Enter or N · Esc quits</p>
</div>
<div id="fade"></div>
<script src="brawl.js?v=596c931"></script>
</body>
</html>
