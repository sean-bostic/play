<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dogfight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2520; font-family: system-ui, -apple-system, sans-serif; user-select: none; cursor: default; }
  canvas { display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #banner { position: fixed; left: 0; right: 0; top: 28%; text-align: center; font: 900 9vmin Impact, "Arial Black", system-ui; color: #ffe14d; pointer-events: none; z-index: 6;
            -webkit-text-stroke: 0.25vmin #1b1b1b; text-shadow: 0 0.07em 0 #1b1b1b, 0 0 0.3em rgba(0,0,0,0.5); opacity: 0; letter-spacing: 0.02em; }
  #banner.show { animation: banner 2s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(0.3) rotate(-8deg); } 12% { opacity: 1; transform: scale(1.15) rotate(3deg); } 22% { transform: scale(1) rotate(0); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6vmin); } }
  #score { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 1.6vmin); transform: translateX(-50%); z-index: 5; padding: 0.8vmin 2vmin; border-radius: 2vmin;
           background: rgba(20,24,36,0.75); color: #fff; font: 800 2.6vmin system-ui; white-space: nowrap; pointer-events: none; }
  #score:empty { display: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .phud { position: absolute; box-sizing: border-box; }
  .phud + .phud { border-left: 2px solid #000; }
  .gauges { position: absolute; left: 1.5vmin; bottom: 1.5vmin; padding: 0.7vmin 1.6vmin; border-radius: 1.5vmin; background: rgba(20,24,36,0.7); color: #fff; font: 700 2.2vmin system-ui; white-space: nowrap; }
  body.touch .gauges { left: auto; right: 2vmin; top: 12vmin; bottom: auto; font-size: 2.6vmin; }
  .gauges .thr { display: inline-block; width: 7vmin; height: 1.2vmin; border-radius: 1vmin; background: rgba(255,255,255,0.2); vertical-align: middle; overflow: hidden; }
  .gauges .thr i { display: block; height: 100%; background: #ffb02e; }
  /* the nuke's reload ring (like the warship's guns in Vehicles): fills over 10 s, then flashes green: armed! */
  .reload { position: absolute; left: calc(50% + 12vmin); top: 70%; width: 9vmin; height: 9vmin; pointer-events: none; display: none; }
  .reload.on { display: block; }
  .reload svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .reload b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.6vmin; opacity: 0.55; }
  .reload.ready b { opacity: 1; }
  .reload .bg { fill: rgba(29,53,87,0.45); stroke: rgba(255,255,255,0.3); stroke-width: 6; }
  .reload .arc { fill: none; stroke: #ff9f1c; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .reload.ready .arc { stroke: #80ed99; }
  .reload.flash { animation: ringpop 0.4s ease-out; } @keyframes ringpop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .warn { position: absolute; left: 0; right: 0; top: 62%; text-align: center; font: 900 6vmin Impact, system-ui; color: #ff3b1f; -webkit-text-stroke: 0.2vmin #000; }
  .blink { animation: blink 0.5s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
  #replay { position: fixed; left: 0; right: 0; top: 0; z-index: 7; display: none; pointer-events: none; text-align: center; font: 900 5vmin Impact, system-ui; color: #fff; padding-top: 2.5vmin; letter-spacing: 0.08em; }
  body.replaying #replay { display: block; }
  body.replaying::before, body.replaying::after { content: ''; position: fixed; left: 0; right: 0; height: 10vh; background: #000; z-index: 6; pointer-events: none; }
  body.replaying::before { top: 0; } body.replaying::after { bottom: 0; }
  body.replaying #replay::after { content: 'any button skips'; display: block; font: 600 1.8vmin system-ui; opacity: 0.7; margin-top: 0.6vmin; letter-spacing: 0; }
  body.replaying #hud, body.replaying #score { display: none; }
  #hint { position: fixed; left: 50%; bottom: 9vmin; transform: translateX(-50%); z-index: 8; padding: 1.4vmin 2.2vmin; border-radius: 2vmin; background: rgba(0,0,0,0.6); color: #fff; font: 600 2vmin/1.6 system-ui;
          opacity: 0; transition: opacity 0.5s; pointer-events: none; white-space: nowrap; }
  #hint.show { opacity: 1; } #hint b { color: #ffe14d; }
  body.touch #hint { display: none; }
  #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin;
             background: #1d2333; color: #ffe14d; font: 900 11vmin Impact, system-ui; -webkit-text-stroke: 0.3vmin #000; transition: opacity 0.6s ease-out; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .bar { width: 46vmin; height: 2.4vmin; border-radius: 2vmin; background: rgba(255,255,255,0.15); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 100%; background: #ffe14d; transform-origin: left; animation: loadbar 2.2s ease-in-out infinite; }
  @keyframes loadbar { 0% { transform: scaleX(0.05); } 70% { transform: scaleX(0.95); } 100% { transform: scaleX(1); opacity: 0; } }
  #fps { display: none; position: fixed; left: 2vmin; top: 2vmin; z-index: 9; padding: 0.6vmin 1.4vmin; border-radius: 1vmin; background: rgba(0,0,0,0.5); color: #fff; font: 600 2vmin system-ui; }
</style>
</head>
<body>
<div id="loading"><div>✈️ DOGFIGHT 💥</div><div class="bar"><i></i></div></div>
<div id="fps"></div>
<canvas id="fx"></canvas>
<div id="hud"></div>
<div id="score"></div>
<div id="banner"></div>
<div id="replay"></div>
<div id="hint">
  <b>Stick</b> fly (back = nose up) · <b>Throttle</b> speed · <b>Trigger</b> fire / drop · <b>Thumb</b> bomb · <b>Button 3</b> next plane · <b>Button 4</b> replay · <b>Button 5+</b> ⚙️<br>
  <b>Arrows</b> fly (↑ nose up) · <b>Shift</b> faster · <b>Z</b> slower · <b>Space</b> guns · <b>B</b> bomb / nuke · <b>S</b> next plane · <b>Enter</b> replay · <b>Tab</b> ⚙️ · <b>Esc</b> quit
</div>
<script src="dogfight.js?v=7e6f94d"></script>
</body>
</html>
